<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ty Pattison</title>
<meta name="description" content="Helping good businesses find their next owners. Making space for rites of passage, mentors and real conversations.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="Ty Pattison">
<meta property="og:description" content="Helping good businesses find their next owners. Making space for rites of passage, mentors and real conversations.">
<meta property="og:image" content="https://ty.life-time.co/surfboard.jpg">
<link rel="preload" href="outfit-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="surfboard.jpg" as="image" media="(max-aspect-ratio: 9/16)">
<link rel="preload" href="surfboard-wide.jpg" as="image" media="(min-aspect-ratio: 9/16)">
<style>
  @font-face {
    font-family: "Outfit";
    src: url("outfit-300.woff2") format("woff2");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }

  /* The photo is 720 x 1280 (surfboard-wide.jpg is the same photo with its
     background carried out sideways to 2880 x 1280 for wider screens).
     --u is one photo pixel when the photo fills the screen height; --t is the
     type scale, which follows the photo until the screen is narrower than the
     photo, then follows the screen width. */
  :root {
    --ink: #0f2361;
    --frame: clamp(12px, 4vw, 24px);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --px: 0px;   /* parallax offset, set by the script at the end of the page */
    --py: 0px;
    --u: calc(100vh / 1280);
    --t: min(var(--u), calc(100vw / 720));
  }
  @supports (height: 100dvh) {
    :root { --u: calc(100dvh / 1280); }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: "Outfit", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- backdrop: photo, centred, with its edge colours filling anything wider ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    transform-origin: 50% 33%;
    animation: settle 1.8s var(--ease) both, breathe 11s ease-in-out 1.8s infinite alternate;
  }

  /* ---------- a soft band of light that drifts slowly across the wall ---------- */
  .light {
    position: fixed;
    inset: -10% -30%;
    background: radial-gradient(ellipse 30% 65% at 50% 45%, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 70%);
    mix-blend-mode: soft-light;
    pointer-events: none;
    animation: glow 2.6s ease both, drift 19s ease-in-out infinite alternate;
  }

  /* ---------- white frame around the whole screen ---------- */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    border: var(--frame) solid #fff;
    pointer-events: none;
  }
  /* slightly oversized so the parallax shift never shows an edge */
  .backdrop picture {
    flex: none;
    display: block;
    height: 100%;
    scale: 1.03;
    transform-origin: 50% 33%;   /* the nose of the board, so it keeps its distance from the links */
    translate: var(--px) var(--py);
  }
  .backdrop img {
    flex: none;
    height: 100%;
    width: auto;
    aspect-ratio: 720 / 1280;
    display: block;
  }
  @media (min-aspect-ratio: 9/16) {
    .backdrop img { aspect-ratio: 2880 / 1280; }
  }
  .edge { flex: 1 0 0; background-size: 100% 100%; background-repeat: no-repeat; }
  .edge.l { background-image: url("edge-l.png"); margin-right: -1px; }
  .edge.r { background-image: url("edge-r.png"); margin-left: -1px; }

  /* ---------- copy ---------- */
  .copy {
    position: fixed;
    top: calc(96 * var(--t));
    left: calc(50% - 303 * var(--t));
    white-space: nowrap;
    translate: calc(var(--px) * -0.35) calc(var(--py) * -0.35);
  }
  .copy > * { animation: rise 1.2s var(--ease) both; }
  .copy > h1 { animation-delay: .35s; }
  .copy > .lede { animation-delay: .55s; }
  .copy > nav { animation-delay: .75s; }
  h1 {
    font-size: calc(80 * var(--t));
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .lede {
    margin-top: calc(40 * var(--t));
    font-size: calc(27 * var(--t));
    line-height: 1.24;
  }
  nav {
    margin-top: calc(48 * var(--t));
    display: flex;
    align-items: center;
    gap: calc(32 * var(--t));
    font-size: calc(27 * var(--t));
    line-height: 1;
  }
  nav a {
    padding: calc(14 * var(--t)) 0;
    margin: calc(-14 * var(--t)) 0;
    background: linear-gradient(currentColor, currentColor) no-repeat 0 calc(100% - 10 * var(--t)) / 0 1px;
    transition: background-size .25s ease;
  }
  nav a:hover, nav a:focus-visible { background-size: 100% 1px; }
  nav a:focus-visible { outline: 1px solid currentColor; outline-offset: calc(6 * var(--t)); }
  nav a.in { background: none; display: flex; transition: opacity .2s; }
  nav a.in:hover { opacity: .65; }
  nav svg { height: calc(25 * var(--t)); width: auto; fill: currentColor; display: block; }

  /* ---------- motion: the photo settles in and then breathes; the copy rises in turn ---------- */
  @keyframes settle {
    from { opacity: 0; transform: scale(1.05); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes breathe {
    from { transform: scale(1); }
    to { transform: scale(1.025); }
  }
  @keyframes glow {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes drift {
    from { transform: translateX(-34%); }
    to { transform: translateX(34%); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(18 * var(--t))); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .backdrop, .copy > * { animation: none; }
    .light { display: none; }
  }

  /* ---------- short, wide screens (a phone on its side): copy left, board right ---------- */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --t: calc(100vh / 620); }
    .backdrop { justify-content: flex-end; }
    .backdrop picture { margin-right: calc(25vw - 1440 * var(--u)); }
    .edge.r { display: none; }
    .copy { top: 50%; left: 6vw; transform: translateY(-50%); }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="edge l"></div>
  <picture>
    <source media="(min-aspect-ratio: 9/16)" srcset="surfboard-wide.jpg">
    <img src="surfboard.jpg" alt="">
  </picture>
  <div class="edge r"></div>
</div>
<div class="light" aria-hidden="true"></div>

<main class="copy">
  <h1>ty pattison</h1>
  <p class="lede">helping good businesses find their next owners.<br>making space for rites of passage,<br>mentors and real conversations.</p>
  <nav aria-label="Links">
    <a class="in" href="https://www.linkedin.com/in/taypattison" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg viewBox="0 0 448 448" aria-hidden="true"><path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"/></svg>
    </a>
    <a href="https://beforemarket.club" target="_blank" rel="noopener">building</a>
    <a href="https://spacious.live" target="_blank" rel="noopener">speaking</a>
    <a href="https://x.com/taytodde/articles" target="_blank" rel="noopener">writing</a>
  </nav>
</main>

<script>
// Parallax: the board drifts a few pixels towards the pointer (or a dragging
// finger, or the tilt of the phone where the browser allows it without asking),
// and the copy drifts the other way. Eased every frame so it glides.
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var root = document.documentElement;
  var tx = 0, ty = 0, x = 0, y = 0, raf = 0;
  var MAX_X = 10, MAX_Y = 7;

  function clamp(v) { return Math.max(-1, Math.min(1, v)); }
  function frame() {
    x += (tx - x) * 0.06;
    y += (ty - y) * 0.06;
    root.style.setProperty("--px", (x * MAX_X).toFixed(2) + "px");
    root.style.setProperty("--py", (y * MAX_Y).toFixed(2) + "px");
    raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.002 ? requestAnimationFrame(frame) : 0;
  }
  function aim(nx, ny) {
    tx = clamp(nx); ty = clamp(ny);
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function fromPoint(px, py) {
    aim(px / innerWidth * 2 - 1, py / innerHeight * 2 - 1);
  }

  addEventListener("mousemove", function (e) { fromPoint(e.clientX, e.clientY); }, { passive: true });
  addEventListener("touchmove", function (e) {
    var t = e.touches[0];
    if (t) fromPoint(t.clientX, t.clientY);
  }, { passive: true });
  document.addEventListener("mouseleave", function () { aim(0, 0); });
  addEventListener("touchend", function () { aim(0, 0); }, { passive: true });

  // Tilt, only where it works without a permission prompt (iOS asks, so it is skipped there).
  var D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission !== "function") {
    var g0 = null, b0 = null;
    addEventListener("deviceorientation", function (e) {
      if (e.gamma == null || e.beta == null) return;
      if (g0 === null) { g0 = e.gamma; b0 = e.beta; }
      aim((e.gamma - g0) / 18, (e.beta - b0) / 18);
    }, { passive: true });
  }
})();
</script>

</body>
</html>
